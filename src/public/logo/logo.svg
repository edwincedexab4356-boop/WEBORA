<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fondo carbón sutil -->
    <linearGradient id="dek-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E121A" />
      <stop offset="100%" stop-color="#06080C" />
    </linearGradient>

    <!-- Azul eléctrico vibrante -->
    <linearGradient id="dek-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#00D2FF" />
      <stop offset="80%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#0047CC" />
    </linearGradient>

    <!-- Resplandor sutil para acentos -->
    <filter id="dek-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Contenedor del Emblema Monograma D.E.K -->
  <g transform="translate(15, 15)">
    <!-- Base de contorno hexagonal/cuadrada redondeada en negro carbón -->
    <rect x="0" y="0" width="90" height="90" rx="20" fill="url(#dek-bg)" stroke="#0066FF" stroke-width="2" stroke-opacity="0.8" />
    <rect x="5" y="5" width="80" height="80" rx="16" fill="none" stroke="#00D2FF" stroke-width="0.8" stroke-opacity="0.3" stroke-dasharray="3 4" />

    <!-- Letra D geométrica -->
    <path d="M22 28 H34 C41 28 46 33 46 40 C46 47 41 52 34 52 H22 V28 Z" 
          fill="none" stroke="url(#dek-blue)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="48" cy="52" r="2" fill="#00D2FF" filter="url(#dek-glow)" />

    <!-- Letra E geométrica -->
    <path d="M52 28 H68 M52 40 H64 M52 52 H68" 
          fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="70" cy="52" r="2" fill="#00D2FF" filter="url(#dek-glow)" />

    <!-- Letra K geométrica y dinámica -->
    <path d="M54 59 V74 M54 66 L66 59 M58 65 L67 74" 
          fill="none" stroke="url(#dek-blue)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Conexión tecnológica inferior y punto central -->
    <path d="M24 67 H38 L43 72 L38 77 H24" 
          fill="none" stroke="#0066FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="43" cy="72" r="3" fill="#00D2FF" filter="url(#dek-glow)" />
    
    <!-- Punto de estado de luz -->
    <circle cx="77" cy="13" r="2" fill="#00D2FF" />
  </g>

  <!-- Tipografía: Monograma D.E.K + NOVACORE debajo + DIGITAL SOLUTIONS -->
  <g transform="translate(125, 20)">
    <!-- D.E.K -->
    <text x="0" y="32" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="900" 
          font-size="28" 
          letter-spacing="5" 
          fill="#FFFFFF">D.E.K</text>
    <circle cx="95" cy="24" r="3.5" fill="#0066FF" filter="url(#dek-glow)" />

    <!-- NOVACORE -->
    <text x="0" y="58" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="900" 
          font-size="20" 
          letter-spacing="6" 
          fill="#F4F4F5">NOVACORE</text>

    <!-- Descriptor: DIGITAL SOLUTIONS -->
    <text x="0" y="78" 
          font-family="'SF Mono', 'Fira Code', Menlo, monospace" 
          font-weight="700" 
          font-size="11" 
          letter-spacing="4.5" 
          fill="#00D2FF">DIGITAL SOLUTIONS</text>
  </g>
</svg>
